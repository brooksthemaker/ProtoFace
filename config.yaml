inputs:
  microphone:
    enabled: true
    type: usb            # usb | i2s
    device_index: null   # explicit PyAudio device index (null = auto-detect)
    # ── I2S MEMS mic options (type: i2s) ──────────────────────────────────────
    # Requires dtoverlay=i2s-mems-mic (or similar) in /boot/config.txt.
    # device_name: i2s   # substring matched against ALSA device name
    # channel: 0         # 0=left (default), 1=right
    sample_rate: 44100
    chunk: 1024
    smoothing: 0.15      # EMA smoothing factor (lower = more smoothing)

  gyro:
    enabled: false
    i2c_address: 0x68    # MPU-6050 default
    sensitivity: 0.4     # pixels of face offset per degree
    max_offset: 8        # pixel clamp

  boop:
    enabled: false
    gpio_pin: 17
    expression: surprised
    duration: 2.0        # seconds before reverting to previous expression
    debounce: 0.05       # seconds

gif:
  folder: gifs
  auto_cycle: false
  cycle_interval: 30.0   # seconds between auto-cycling GIFs

ipc:
  socket: /run/protoface.sock        # Unix socket path for ProtoHUD → Protoface commands
  shm_path: /dev/shm/protoface_frame # Shared memory path for Protoface → ProtoHUD preview
