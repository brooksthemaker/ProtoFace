panel:
  # Physical panel dimensions (single panel)
  panel_width: 64
  panel_height: 32
  brightness: 80
  hardware_mapping: regular          # regular | adafruit-hat | adafruit-hat-pwm | classic
  gpio_slowdown: 4                   # P2.5 panels typically need 3-4
  chain_length: 2                    # 2 panels daisy-chained on port 1
  parallel: 1                        # only port 1 in use (triple bonnet supports up to 3)
  # Logical canvas = panel_width*chain_length × panel_height*parallel = 128×32

display:
  fps: 30
  preview: false         # true = pygame window (dev); false = HUB75 output (Pi)
  preview_scale: 6       # scale factor for the preview window
  background: [0, 0, 0]  # RGB background colour

# ── 2-panel face layout (128×32) ──────────────────────────────────────────────
# Two 64×32 panels chained on port 1, both showing the same full face from
# faces/main. The right panel mirrors the left (mirror_of) so the face is
# symmetric and the two halves stay perfectly in sync.
# region: [x, y, width, height] in canvas pixels.

panels:
  - name: face_left
    region: [0, 0, 64, 32]
    face:
      active: main
      wiggle:   {speed: 0.8, amplitude_x: 2.0, amplitude_y: 1.0}
      blink:    {interval_min: 3.0, interval_max: 7.0, duration: 0.15}
      expression_fade: 0.3
      mouth_sensitivity: 0.5
    material: {active: teal, scroll_x: 0.0, scroll_y: 0.0}
    particles: {active: none}

  - name: face_right
    region: [64, 0, 64, 32]
    mirror_of: face_left      # render = face_left flipped horizontally
    face: {active: main}      # built but overwritten by the mirror pass
    material: {active: teal}
    particles: {active: none}

# ── Particle layer examples ───────────────────────────────────────────────────
