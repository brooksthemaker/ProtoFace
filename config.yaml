panel:
  # Physical panel dimensions (single panel)
  panel_width: 64
  panel_height: 32
  brightness: 80
  hardware_mapping: regular          # regular | adafruit-hat | adafruit-hat-pwm | classic
  gpio_slowdown: 4                   # P2.5 panels typically need 3-4
  chain_length: 2                    # panels chained horizontally per row
  parallel: 2                        # rows of panels stacked vertically
  # Logical canvas = panel_width*chain_length × panel_height*parallel = 128×64

display:
  fps: 30
  preview: true          # true = pygame window (dev); false = HUB75 output (Pi)
  preview_scale: 6       # scale factor for the preview window
  background: [0, 0, 0]  # RGB background colour

# ── 4-panel face layout ───────────────────────────────────────────────────────
# Each entry renders independently to its region of the 128×64 canvas.
# region: [x, y, width, height] in canvas pixels.

panels:
  - name: left_eye
    region: [0, 0, 64, 32]
    face:
      active: left_eye
      wiggle:   {speed: 0.8,  amplitude_x: 2.0, amplitude_y: 1.0}
      blink:    {interval_min: 3.0, interval_max: 7.0, duration: 0.15}
      expression_fade: 0.3
      mouth_sensitivity: 0.5
    material: {active: teal, scroll_x: 0.0, scroll_y: 0.0}
    particles: {active: none}

  - name: right_eye
    region: [64, 0, 64, 32]
    face:
      active: right_eye
      wiggle:   {speed: 0.85, amplitude_x: 2.0, amplitude_y: 1.0}  # offset phase
      blink:    {interval_min: 3.5, interval_max: 7.5, duration: 0.15}
      expression_fade: 0.3
      mouth_sensitivity: 0.5
    material: {active: teal, scroll_x: 0.0, scroll_y: 0.0}
    particles: {active: none}

  - name: left_mouth
    region: [0, 32, 64, 32]
    face:
      active: left_mouth
      wiggle:   {speed: 0.0, amplitude_x: 0.0, amplitude_y: 0.0}
      blink:    {interval_min: 999, interval_max: 1000, duration: 0.0}
      expression_fade: 0.1
      mouth_sensitivity: 0.5
    material: {active: teal, scroll_x: 12.0, scroll_y: 0.0}
    particles:
      preset: fire

  - name: right_mouth
    region: [64, 32, 64, 32]
    face:
      active: right_mouth
      wiggle:   {speed: 0.0, amplitude_x: 0.0, amplitude_y: 0.0}
      blink:    {interval_min: 999, interval_max: 1000, duration: 0.0}
      expression_fade: 0.1
      mouth_sensitivity: 0.5
    material: {active: teal, scroll_x: -12.0, scroll_y: 0.0}   # mirror scroll
    particles:
      preset: fire

