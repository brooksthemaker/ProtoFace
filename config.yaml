panel:
  panel_width: 64            #{16-128}
  panel_height: 32           #{16-64}
  chain_length: 2            #{1-8}
  parallel: 1                #{1-3}
  # Logical canvas = panel_width*chain_length × panel_height*parallel = 128×32
  brightness: 80             #{ignored}
  hardware_mapping: regular  #{ignored}
  gpio_slowdown: 4           #{ignored}

display:
  fps: 30                #{10-60}
  preview: false         #{true|false}
  preview_scale: 6       #{1-20}
  background: [0, 0, 0]  #{0-255,0-255,0-255}

# Two 64×32 panels on port 1; right mirrors left (mirror_of). region: [x,y,w,h] in canvas px.
panels:
  - name: face_left
    region: [0, 0, 64, 32]   #{0-127,0-31,1-128,1-32}
    face:
      active: main           #{faces/ folder}
      wiggle:   {speed: 0.8, amplitude_x: 2.0, amplitude_y: 1.0}        #{0-3,0-10,0-10}
      blink:    {interval_min: 3.0, interval_max: 7.0, duration: 0.15}  #{0.5-60,0.5-60,0.05-0.5}
      expression_fade: 0.3   #{0-2}
      mouth_sensitivity: 0.5 #{0-2}
    material: {active: teal, scroll_x: 0.0, scroll_y: 0.0}   #{teal|rainbow|warm|cool|solid:RGB, -30-30, -30-30}
    particles: {active: none}   #{none|effect|preset|layers}

  - name: face_right
    region: [64, 0, 64, 32]  #{0-127,0-31,1-128,1-32}
    mirror_of: face_left     #{panel name}
    face: {active: main}
    material: {active: teal}
    particles: {active: none}

# Effect names: sparkle|snow|embers|confetti|rings|rain|fireflies
# Presets:      fire|aurora|blizzard|sonar|plasma|celebration|galaxy|party
# Layered form (put on face_left only; face_right mirrors it):
#    particles:
#      layers:
#        - effect: embers     #{effect name}
#          count: 30          #{1-100}
#          colors: [[255,60,0],[255,100,10]]   #{[0-255,0-255,0-255], ...}
#          speed_min: 8.0     #{0-60}
#          speed_max: 22.0    #{>=speed_min}
#          size_min: 1        #{1-4}
#          size_max: 2        #{>=size_min}
#          life_min: 0.05     #{0.05-5}
#          life_max: 0.15     #{>=life_min}
#          blend: add         #{add|normal}

# ── Baked-in effects ──────────────────────────────────────────────────────────
# Each enabled effect is layered onto the face (combine freely). Toggle with
# enabled. Layer params use the same ranges as the particle reference above.
effects:
  fire:
    enabled: false       #{true|false}
    layers:
      - {effect: embers, colors: [[255,0,0],[255,120,10]], count: 30, speed_min: 8, speed_max: 22, blend: add}
  sparkle:
    enabled: false       #{true|false}
    layers:
      - {effect: sparkle, colors: [[255,255,220]], count: 8, life_min: 0.05, life_max: 0.2, blend: add}
  snow:
    enabled: false       #{true|false}
    layers:
      - {effect: snow, colors: [[200,220,255]], count: 30, speed_min: 6, speed_max: 12, blend: add}

inputs:
  microphone:
    enabled: true        #{true|false}
    type: usb            #{usb|i2s}
    device_index: null   #{int|null}
    sample_rate: 44100   #{16000|44100|48000}
    chunk: 1024          #{256-4096}
    smoothing: 0.15      #{0-1}
    # i2s only: device_name (str), channel #{0|1}; needs dtoverlay=i2s-mems-mic in /boot/firmware/config.txt

  gyro:
    enabled: false       #{true|false}
    i2c_address: 0x68    #{0x68|0x69}
    sensitivity: 0.4     #{0-2}
    max_offset: 8        #{0-16}

  boop:
    enabled: false       #{true|false}
    gpio_pin: 17         #{0-27, avoid matrix pins}
    expression: surprised #{expression name}
    duration: 2.0        #{>0}
    debounce: 0.05       #{0.01-0.5}

gif:
  folder: gifs           #{path}
  auto_cycle: false      #{true|false}
  cycle_interval: 30.0   #{>0}
  auto_release: 5.0      #{>=0; secs after a play_gif to revert to the face; 0=loop forever}

ipc:
  socket: /tmp/protoface.sock        #{path}  (/run is root-only; /tmp is user-writable)
  shm_path: /dev/shm/protoface_frame #{path}
